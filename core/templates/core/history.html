{% extends 'core/base.html' %}
{% block content %}
  <div class="card">
    <h2>Alert History</h2>
    <table class="history-table">
      <thead>
        <tr><th>Sender</th><th>Message</th><th>Location</th><th>Time</th></tr>
      </thead>
      <tbody>
        {% for a in alerts %}
          <tr>
            <td>{{ a.user.name }}</td>
            <td>{{ a.message|linebreaksbr }}</td>
            <td>{% if a.location_link %}<a href="{{ a.location_link }}" target="_blank">Map</a>{% else %}-{% endif %}</td>
            <td>{{ a.created_at }}</td>
          </tr>
        {% empty %}
          <tr><td colspan="4">No alerts yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
